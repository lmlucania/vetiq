openapi: 3.0.0
info:
  title: 'Vetiq API'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8080'
paths:
  /hospital/login:
    post:
      tags:
        - Hospital
      summary: ログイン
      operationId: e536880aed23ff421f6e6cd08e14ff4d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Requests~1Hospital~1LoginRequest'
      responses:
        200:
          description: ログイン成功
          content:
            application/json:
              schema:
                properties:
                  token:
                    type: string
                    example: 9|bWKC0YcBfDE1lOsBPmKAwMTTN91xu7iAEyxJcF1j1e936bed
                  expires_at:
                    type: string
                    format: date-time
                    example: '2025-04-29T10:23:00Z'
                type: object
        401:
          description: ログイン失敗
  /hospital/logout:
    post:
      tags:
        - Hospital
      summary: ログアウト
      operationId: e8b5787dbac0ed48bbc31ee8b3c29918
      responses:
        200:
          description: ログアウト成功
  /hospital/refresh-token:
    post:
      tags:
        - Hospital
      summary: トークンリフレッシュ
      operationId: 86da74dbbc4ed68675e5037c3bb35500
      responses:
        200:
          description: ログアウト成功
  /hospital/business_hours:
    get:
      tags:
        - Hospital
      summary: 受付時間の一覧
      operationId: 720be06399f8b54b4a976b04fae71e4a
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response~1BusinessHour'
    post:
      tags:
        - Hospital
      summary: 指定した曜日の受付時間の作成/更新
      operationId: 16608eef905d5be3dc3a9f335784ff6b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Requests~1Hospital~1StoreBusinessHourRequest'
      responses:
        200:
          description: 成功
        400:
          description: 失敗
  '/hospital/business_hours/{uuid}':
    delete:
      tags:
        - Hospital
      summary: 予約受付時間の削除
      operationId: b8332399d042fa0bc3cbd42e5b496b13
      parameters:
        -
          name: uuid
          in: path
          description: 受付時間ID
          example: 1667cff9-71e5-4719-953c-e074507d2d3d
      responses:
        200:
          description: 成功
        400:
          description: 失敗
        404:
          description: 'Not Found'
  /hospital/info:
    get:
      tags:
        - Hospital
      summary: 病院情報を取得
      operationId: 3a01b01dd95e29de3eb73a0f487a9cdf
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response~1Hospital'
    put:
      tags:
        - Hospital
      summary: 病院情報を更新
      operationId: 256b677b9da1cf3e8ca8b69659c910da
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Requests~1Hospital~1StoreHospitalRequest'
      responses:
        200:
          description: 成功
        422:
          description: バリデーションエラー
  /hospital/menus:
    get:
      tags:
        - Hospital
      summary: 診察メニューの一覧
      operationId: c456a36de2619e061663dc8aedbea58b
      parameters:
        -
          name: page
          in: query
          description: ページ番号
        -
          name: per_page
          in: query
          description: 1ページあたりの表示数（デフォルト50件）
        -
          name: 'sort[]'
          in: query
          description: 並び替え
          style: deepObject
          explode: true
          schema:
            type: array
            items:
              type: string
            example:
              - name
              - '-detail'
        -
          name: keyword
          in: query
          description: 検索キーワード（メニュー名または説明の部分一致）
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response~1Menu'
    post:
      tags:
        - Hospital
      summary: 診察メニューの登録
      operationId: 3e345b33ebb7f7232d9afd4a84270007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Requests~1Hospital~1StoreMenuRequest'
      responses:
        200:
          description: 成功
        400:
          description: 失敗
  '/hospital/menus/{uuid}':
    get:
      tags:
        - Hospital
      summary: 診察メニューの詳細
      operationId: 22cab2c12d92e3e1e54720ffe674e6d9
      parameters:
        -
          name: uuid
          in: path
          description: 診察メニューID
          example: 1667cff9-71e5-4719-953c-e074507d2d3d
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response~1Menu'
        404:
          description: 'Not Found'
    put:
      tags:
        - Hospital
      summary: 診察メニューの更新
      operationId: c5591d5ec30e9ac2a04bcdd60ec8c8e2
      parameters:
        -
          name: uuid
          in: path
          description: 診察メニューID
          example: 1667cff9-71e5-4719-953c-e074507d2d3d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Requests~1Hospital~1UpdateMenuRequest'
      responses:
        200:
          description: 成功
        400:
          description: 失敗
        404:
          description: 'Not Found'
    delete:
      tags:
        - Hospital
      summary: 診察メニューの削除
      operationId: 7eca8192e88f69f50380b7ff831bb245
      parameters:
        -
          name: uuid
          in: path
          description: 診察メニューID
          example: 1667cff9-71e5-4719-953c-e074507d2d3d
      responses:
        200:
          description: 成功
        400:
          description: 失敗
        404:
          description: 'Not Found'
  '/hospital/menus/{uuid}/publish':
    post:
      tags:
        - Hospital
      summary: 診察メニューを公開に変更
      operationId: 008df7ab13c28aa7b7bf9668f0f40cce
      parameters:
        -
          name: uuid
          in: path
          description: 診察メニューID
          example: 1667cff9-71e5-4719-953c-e074507d2d3d
      responses:
        200:
          description: 成功
        400:
          description: 失敗
        404:
          description: 'Not Found'
  '/hospital/menus/{uuid}/unpublish':
    post:
      tags:
        - Hospital
      summary: 診察メニューを非公開に変更
      operationId: 1fdd59a1c6c1293cba6dccd03dc07fec
      parameters:
        -
          name: uuid
          in: path
          description: 診察メニューID
          example: 1667cff9-71e5-4719-953c-e074507d2d3d
      responses:
        200:
          description: 成功
        400:
          description: 失敗
        404:
          description: 'Not Found'
  /hospital/vets:
    get:
      tags:
        - Hospital
      summary: 獣医師の一覧
      operationId: 2c2be280207d2b485f99d1a17c15b4b2
      parameters:
        -
          name: page
          in: query
          description: ページ番号
        -
          name: per_page
          in: query
          description: 1ページあたりの表示数（デフォルト50件）
        -
          name: 'sort[]'
          in: query
          description: 並び替え
          style: deepObject
          explode: true
          schema:
            type: array
            items:
              type: string
            example:
              - last_name
              - '-accept_appointment'
        -
          name: keyword
          in: query
          description: 検索キーワード（名前（姓）または名前（名）の部分一致）
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response~1Vet'
    post:
      tags:
        - Hospital
      summary: 獣医師の登録
      operationId: 2da1eb674c547f94f39256e9befc218e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Requests~1Hospital~1StoreVetRequest'
      responses:
        200:
          description: 成功
        400:
          description: 失敗
  '/hospital/vets/{uuid}':
    get:
      tags:
        - Hospital
      summary: 獣医師の詳細
      operationId: a77ca6ba36f69e12f3ae9ad3dabd1309
      parameters:
        -
          name: uuid
          in: path
          description: 獣医師ID
          example: 5705d9e7-39bd-44c4-af36-be78d0eeb825
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response~1Vet'
        404:
          description: 'Not Found'
    put:
      tags:
        - Hospital
      summary: 獣医師の登録
      operationId: 099fb7ccd2680391eea7430ec713864a
      parameters:
        -
          name: uuid
          in: path
          description: 獣医師ID
          example: 5705d9e7-39bd-44c4-af36-be78d0eeb825
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Requests~1Hospital~1UpdateVetRequest'
      responses:
        200:
          description: 成功
        400:
          description: 失敗
    delete:
      tags:
        - Hospital
      summary: 獣医師の削除
      operationId: c016f75f05587fdbed835da153447401
      parameters:
        -
          name: uuid
          in: path
          description: 獣医師ID
          example: 5705d9e7-39bd-44c4-af36-be78d0eeb825
      responses:
        200:
          description: 成功
        400:
          description: 失敗
        404:
          description: 'Not Found'
components:
  schemas:
    Enum/DayOfWeek:
      description: 曜日
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      example: 0
    Enum/TimePeriod:
      description: 午前・午後
      type: integer
      enum:
        - 0
        - 1
      example: 0
    Requests/Hospital/LoginRequest:
      description: 病院スタッフログイン
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: staff+1@example.com
        password:
          type: string
          format: password
          example: password
      type: object
    Requests/Hospital/StoreBusinessHourRequest:
      description: 指定した曜日の予約受付時間の作成/更新
      required:
        - day_of_week
        - periods
        - 'periods.*.period_type'
        - 'periods.*.start_time'
        - 'periods.*.end_time'
      properties:
        day_of_week:
          $ref: '#/components/schemas/Enum~1DayOfWeek'
        periods:
          description: 予約受付時間のリスト（最大2件）
          type: array
          items:
            properties:
              time_period:
                $ref: '#/components/schemas/Enum~1TimePeriod'
              start_time:
                description: '開始時間（HH:MM形式）'
                type: string
                format: time
                example: '09:00'
              end_time:
                description: '終了時間（HH:MM形式）'
                type: string
                format: time
                example: '12:00'
            type: object
          maxItems: 2
      type: object
    Requests/Hospital/StoreHospitalRequest:
      description: 病院情報の保存
      required:
        - name
        - zipcode
        - address
        - phone
        - is_published
      properties:
        name:
          description: 病院名
          type: string
          example: テスト病院
        zipcode:
          description: '郵便番号 (7桁)'
          type: string
          example: 1234567
        address:
          description: 住所
          type: string
          example: 東京都新宿区西新宿2-8-1
        phone:
          description: '電話番号 (10または11桁)'
          type: string
          example: '0123456789'
        is_published:
          description: 公開状態
          type: boolean
          example: true
      type: object
    Requests/Hospital/StoreMenuRequest:
      description: 診察メニューの登録
      required:
        - name
        - detail
        - required_time
        - is_published
      properties:
        name:
          description: 診察メニュー名
          type: string
          example: 健康診断
        detail:
          description: 診察メニューの説明
          type: string
          example: 年に一度の健康診断で、体調をチェックします。
        required_time:
          description: 所要時間（分単位）
          type: integer
          maximum: 300
          example: 30
        is_published:
          description: 公開フラグ
          type: boolean
      type: object
    Requests/Hospital/StoreVetRequest:
      description: 獣医師の登録
      required:
        - last_name
        - first_name
        - accept_appointment
        - remark
      properties:
        last_name:
          description: 名前（姓）
          type: string
          example: 山田
        first_name:
          description: 名前（名）
          type: string
          example: 太郎
        accept_appointment:
          description: 指名予約可否フラグ
          type: boolean
          example: true
        remark:
          description: 備考
          type: string
          example: 皮膚科専門医
      type: object
    Requests/Hospital/UpdateMenuRequest:
      description: 診察メニューの更新
      required:
        - name
        - detail
        - required_time
        - is_published
      properties:
        name:
          description: 診察メニュー名
          type: string
          example: 健康診断
        detail:
          description: 診察メニューの説明
          type: string
          example: 年に一度の健康診断で、体調をチェックします。
        required_time:
          description: 所要時間（分単位）
          type: integer
          maximum: 300
          example: 30
        is_published:
          description: 公開フラグ
          type: boolean
      type: object
    Requests/Hospital/UpdateVetRequest:
      description: 獣医師の更新
      required:
        - last_name
        - first_name
        - accept_appointment
        - remark
      properties:
        last_name:
          description: 名前（姓）
          type: string
          example: 山田
        first_name:
          description: 名前（名）
          type: string
          example: 太郎
        accept_appointment:
          description: 指名予約可否フラグ
          type: boolean
          example: true
        remark:
          description: 備考
          type: string
          example: 皮膚科専門医
      type: object
    Response/BusinessHour:
      description: 受付時間
      properties:
        uuid:
          description: 受付時間ID
          type: string
          example: 1667cff9-71e5-4719-953c-e074507d2d3d
        day_of_week:
          description: 曜日
          type: integer
          example: 0
        time_period:
          description: 午前午後
          type: integer
          example: 0
        start_time:
          description: 受付開始時間
          type: string
          format: time
          example: '9:00'
        end_time:
          description: 受付終了時間
          type: string
          format: time
          example: '12:00'
      type: object
    Response/Hospital:
      description: 病院情報
      properties:
        uuid:
          description: 病院ID
          type: string
          example: e23c0dce-5d69-4572-a283-3643d69350bc
        name:
          description: 病院名
          type: string
          example: テスト病院
        zipcode:
          description: 郵便番号
          type: string
          example: '1234567'
        address:
          description: 住所
          type: string
          example: 山梨県工藤市南区津田町加藤5-1-5
        phone:
          description: 電話番号
          type: string
          example: '0123456789'
        is_published:
          description: 公開フラグ
          type: boolean
          example: true
      type: object
    Response/Menu:
      description: 診察メニュー
      properties:
        uuid:
          description: 診察メニューID
          type: string
          example: 1667cff9-71e5-4719-953c-e074507d2d3d
        name:
          description: 診察メニュー名
          type: string
          example: 一般診察
        detail:
          description: 説明
          type: string
          example: 基本的な診察を行います。健康状態のチェックや病気の早期発見をサポートします。
        required_time:
          description: 所要時間（分）
          type: string
          example: '30'
        is_published:
          description: 公開フラグ
          type: boolean
          example: true
      type: object
    Response/Vet:
      description: 獣医師
      properties:
        uuid:
          description: 獣医師UUID
          type: string
          example: 5705d9e7-39bd-44c4-af36-be78d0eeb825
        last_name:
          description: 名前（姓）
          type: string
          example: 山田
        first_name:
          description: 名前（名）
          type: string
          example: 太郎
        accept_appointment:
          description: 指名予約可否フラグ
          type: boolean
          example: true
        remark:
          description: 備考
          type: string
          example: 犬・猫の内科診療を得意としています。
      type: object
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: tokenを入力してください。
      name: Authorization
      in: header
tags:
  -
    name: Hospital
    description: 病院スタッフ
security:
  -
    sanctum: []
